# This docker-compose includes both Zetaris platform and our AI News Discussion app
# Zetaris platform services are defined with the same config as C:\zetaris-platform
# Our app connects to Zetaris API at http://api:8888

services:
  # ============================================================
  # ZETARIS PLATFORM SERVICES
  # ============================================================
  
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE:-1GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - max_wal_size=2GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zetaris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set -- see .env}
      POSTGRES_DB: metastore
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PUBLISH:-0}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-zetaris} -d metastore"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  init:
    image: ${DRIVER_IMAGE:?set DRIVER_IMAGE in .env}
    platform: linux/amd64
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/bash", "/init/generate-secrets.sh"]
    volumes:
      - driver-data:/home/zetaris/zetaris-ndp-driver/data
      - driver-logs:/home/zetaris/zetaris-ndp-driver/logs
      - customer-data:/home/zetaris/customer-data
      - ./server/init:/init:ro

  driver:
    image: ${DRIVER_IMAGE}
    platform: linux/amd64
    restart: unless-stopped
    hostname: driver
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "driver:127.0.0.1"
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    entrypoint: ["/bin/bash", "/init/driver-entrypoint.sh"]
    environment:
      METASTORE_JDBC_URL: jdbc:postgresql://postgres:5432/metastore?user=${POSTGRES_USER:-zetaris}&password=${POSTGRES_PASSWORD}
      AUDIT_LOG_JDBC_URL: jdbc:postgresql://postgres:5432/audit?user=${POSTGRES_USER:-zetaris}&password=${POSTGRES_PASSWORD}
      NDP_TOKEN: /home/zetaris/zetaris-ndp-driver/data/tokens/ndp_token
      ENCRYPTION_LOCAL_PRIVATE_KEY_PATH: /home/zetaris/zetaris-ndp-driver/data/passwordkeys/private_key.der
      ENCRYPTION_LOCAL_PUBLIC_KEY_PATH: /home/zetaris/zetaris-ndp-driver/data/passwordkeys/public_key.der
      SPARK_NO_DAEMONIZE: "1"
      SPARK_LOG_DIR: /home/zetaris/zetaris-ndp-driver/logs
      SPARK_PID_DIR: /tmp
      ZSPARK_MASTER_URL: ${ZSPARK_MASTER_URL:-local[*]}
      ZSPARK_DRIVER_MEM: ${ZSPARK_DRIVER_MEM:-2g}
      ZSPARK_DRIVER_CORES: ${ZSPARK_DRIVER_CORES:-2}
      BASE_ENDPOINT: http://api:8889/
      FILESYSTEM_STAGING: /home/zetaris/customer-data
      NDP_ROOT_PATH: /home/zetaris/customer-data
      ZETARIS_LOCAL_FILE_SYTEM_ROOT_PATH: /home/zetaris/customer-data/shared
      PLATFORM_TYPE: vm
      ZETARIS_ADMIN_EMAIL: ${ZETARIS_ADMIN_EMAIL:-admin@zetaris.com}
      ZETARIS_ADMIN_PASSWORD: ${ZETARIS_ADMIN_PASSWORD:?ZETARIS_ADMIN_PASSWORD must be set}
      ZETARIS_ADMIN_ORG: ${ZETARIS_ADMIN_ORG:-zetaris}
    volumes:
      - ./server/init:/init:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - customer-data:/home/zetaris/customer-data
      - driver-data:/home/zetaris/zetaris-ndp-driver/data
      - driver-logs:/home/zetaris/zetaris-ndp-driver/logs
    ports:
      - "127.0.0.1:${DRIVER_PORT:-10000}:10000"
      - "127.0.0.1:${SPARK_UI_PORT:-4041}:4040"
      - "127.0.0.1:${QUERY_HTTP_PUBLISH:-0}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/10000"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 180s

  api:
    image: ${API_IMAGE:?set API_IMAGE in .env}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      driver:
        condition: service_healthy
    group_add:
      - "1001"
    environment:
      METASTORE_DATABASE_URL: jdbc:postgresql://postgres:5432/metastore?user=${POSTGRES_USER:-zetaris}&password=${POSTGRES_PASSWORD}
      AUDIT_LOG_DATABASE_URL: jdbc:postgresql://postgres:5432/audit?user=${POSTGRES_USER:-zetaris}&password=${POSTGRES_PASSWORD}
      LIGHTNING_SERVER_URL: jdbc:zetaris:lightning@driver:10000
      NDP_TOKEN: /home/zetaris/zetaris-ndp-driver/data/tokens/ndp_token
      ENCRYPTION_LOCAL_PRIVATE_KEY_PATH: /home/zetaris/zetaris-ndp-driver/data/passwordkeys/private_key.der
      ENCRYPTION_LOCAL_PUBLIC_KEY_PATH: /home/zetaris/zetaris-ndp-driver/data/passwordkeys/public_key.der
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      GUI_URL: ${GUI_URL:-http://localhost:3000}
      NDP_ROOT_PATH: /home/zetaris/customer-data
      ZETARIS_LOCAL_FILE_SYTEM_ROOT_PATH: /home/zetaris/customer-data/shared
      JAVA_OPTS: -Xms256m -Xmx${ZETARIS_API_MAX_HEAP:-1g} -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
      LIGHTNING_API_DEPLOY_MODE: internal
      PLATFORM_TYPE: vm
      INSTALL_ID_PATH: /home/zetaris/zetaris-ndp-driver/data/install-id
      TELEMETRY_KEY: ${TELEMETRY_KEY:-}
      TELEMETRY_URL: ${TELEMETRY_URL:-https://cloud-api.enterprise.zetaris.com/api/v1.0/hackathon}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-}
      TELEMETRY_INTERVAL_MINUTES: ${TELEMETRY_INTERVAL_MINUTES:-120}
    volumes:
      - driver-data:/home/zetaris/zetaris-ndp-driver/data:ro
      - customer-data:/home/zetaris/customer-data
    ports:
      # The host-side ports are outside the Windows reserved range (8871-9070);
      # a mapping such as 8888 would be created but never listened on.
      - "127.0.0.1:${API_PORT:-14098}:8888"
      - "127.0.0.1:${API_INTERNAL_PORT:-14099}:8889"
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -o /dev/null http://127.0.0.1:8888/"]
      interval: 10s
      timeout: 5s
      retries: 180
      start_period: 120s

  ui:
    image: ${UI_IMAGE:?set UI_IMAGE in .env}
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LIGHTNING_API_HOST: api
      APACHE_AIRFLOW_ENABLED: "false"
      ENABLED_ZEPPELIN: "false"
    ports:
      - "${UI_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/config"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

  bootstrap:
    image: ${DRIVER_IMAGE}
    platform: linux/amd64
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/init/bootstrap-admin.sh"]
    environment:
      METASTORE_JDBC_URL: jdbc:postgresql://postgres:5432/metastore?user=${POSTGRES_USER:-zetaris}&password=${POSTGRES_PASSWORD}
      AUDIT_LOG_JDBC_URL: jdbc:postgresql://postgres:5432/audit?user=${POSTGRES_USER:-zetaris}&password=${POSTGRES_PASSWORD}
      NDP_TOKEN: /home/zetaris/zetaris-ndp-driver/data/tokens/ndp_token
      ENCRYPTION_LOCAL_PRIVATE_KEY_PATH: /home/zetaris/zetaris-ndp-driver/data/passwordkeys/private_key.der
      ENCRYPTION_LOCAL_PUBLIC_KEY_PATH: /home/zetaris/zetaris-ndp-driver/data/passwordkeys/public_key.der
      ZETARIS_ADMIN_EMAIL: ${ZETARIS_ADMIN_EMAIL:-admin@zetaris.com}
      ZETARIS_ADMIN_PASSWORD: ${ZETARIS_ADMIN_PASSWORD:?ZETARIS_ADMIN_PASSWORD must be set}
      FILESYSTEM_STAGING: /home/zetaris/customer-data
      NDP_ROOT_PATH: /home/zetaris/customer-data
      ZETARIS_LOCAL_FILE_SYTEM_ROOT_PATH: /home/zetaris/customer-data/shared
      ZSPARK_MASTER_URL: local[1]
      ZSPARK_DRIVER_MEM: 1g
    volumes:
      - driver-data:/home/zetaris/zetaris-ndp-driver/data
      - driver-logs:/home/zetaris/zetaris-ndp-driver/logs
      - customer-data:/home/zetaris/customer-data
      - ./server/init:/init:ro

  # Optional TLS frontend
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      ui:
        condition: service_healthy
    environment:
      ZETARIS_PUBLIC_HOST: ${ZETARIS_PUBLIC_HOST:-}
      CADDY_GLOBAL_OPTIONS: ${CADDY_GLOBAL_OPTIONS:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # ============================================================
  # OUR APPLICATION SERVICES
  # ============================================================

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Zetaris: the app talks to the Zetaris Lightning REST API over SQL
      # (POST /api/v1.0/sql-editor/sqls/run). Inside this compose network the
      # bundled platform is reachable as http://api:8888 (the host's 8888 is
      # bound to 127.0.0.1 and is NOT reachable from a container).
      # ZETARIS_API_KEY / ZETARIS_ORG_ID must belong to THAT instance: create a
      # key in its GUI (http://localhost:${UI_PORT:-3010}) and set the numeric
      # organisation id. SERVER_ZETARIS_URL overrides the target if needed.
      ZETARIS_URL: ${SERVER_ZETARIS_URL:-http://api:8888}
      ZETARIS_API_KEY: ${ZETARIS_API_KEY:-}
      ZETARIS_ORG_ID: ${ZETARIS_ORG_ID:-1}

      # Meterless AI (hosted endpoint for non meterless/* model ids). The same
      # METERLESS_API_KEY is the Meterless Runtime token, so the runtime provider
      # starts configured. METERLESS_RUNTIME_TOKEN overrides it when it differs.
      METERLESS_API_URL: ${METERLESS_API_URL:-https://api.meterless.ai/v1}
      METERLESS_API_KEY: ${METERLESS_API_KEY:-}

      # Meterless Runtime provider. A runtime bound to 127.0.0.1 on the host is
      # NOT reachable from here: point METERLESS_BASE_URL at an address the
      # container can reach (or paste a connect link in the AI Provider page).
      METERLESS_APP_ID: ${METERLESS_APP_ID:-ai-news-discussion}
      METERLESS_STATE_DIR: ${METERLESS_STATE_DIR:-/home/node/.meterless}
      METERLESS_BASE_URL: ${METERLESS_BASE_URL:-}
      METERLESS_RUNTIME_TOKEN: ${METERLESS_RUNTIME_TOKEN:-}

      # Server config
      PORT: 3001
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    volumes:
      - ./server/init:/init:ro
      - server-data:/app/server/data

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        REACT_APP_API_URL: ${CLIENT_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "3002:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

volumes:
  pgdata:
  caddy-data:
  caddy-config:
  driver-logs:
  customer-data:
  driver-data:
  server-data: